name: Android Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: >-
            platform-tools
            platforms;android-37.0
            build-tools;37.0.0
            cmake;4.1.2
            ndk;30.0.16248370

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Check host regressions and documentation examples
        run: python3 -m unittest discover -s tests -v

      - name: Build debug and release
        run: |
          ./gradlew \
            :app:assembleDebug :app:assembleRelease :app:lintDebug :app:lintRelease \
            -Ptemplate.localTestSigning=true \
            --stacktrace --warning-mode all
