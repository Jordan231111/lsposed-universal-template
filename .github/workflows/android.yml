name: Android Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: >-
            platform-tools
            platforms;android-37.0
            build-tools;37.0.0
            cmake;4.1.2
            ndk;30.0.16248370

      - name: Load shared Android signing identity
        if: github.event_name != 'pull_request'
        env:
          TEMPLATE_KS_BASE64: ${{ secrets.TEMPLATE_KS_BASE64 }}
          TEMPLATE_KS_PASS: ${{ secrets.TEMPLATE_KS_PASS }}
          TEMPLATE_KEY_ALIAS: ${{ secrets.TEMPLATE_KEY_ALIAS }}
          TEMPLATE_KEY_PASS: ${{ secrets.TEMPLATE_KEY_PASS }}
          TEMPLATE_CERT_SHA256: ${{ vars.TEMPLATE_CERT_SHA256 }}
        run: python3 tools/setup_shared_signing.py

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Check host regressions and documentation examples
        run: python3 -m unittest discover -s tests -v

      - name: Build debug and release
        run: |
          ./gradlew ${{ github.event_name == 'pull_request' && '-Ptemplate.localTestSigning=true' || '' }} \
            :app:assembleDebug :app:assembleRelease :app:lintDebug :app:lintRelease \
            --stacktrace --warning-mode all

      - name: Remove staged signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/shared-android-signing.p12"
